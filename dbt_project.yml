name: 'proyecto_laliga'
version: '1.0.0'
config-version: 2

profile: 'default'

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  proyecto_laliga:
    # Staging: vistas 1:1 con Bronze (renombrar y castear). Viven en la database de Silver.
    staging:
      +database: "{{ env_var('DBT_SILVER_DB') }}"
      +materialized: view
      api_laliga:
        +schema: api_laliga
      proveedor_estadisticas:
        +schema: proveedor_estadisticas
      rrhh:
        +schema: rrhh
      mercado:
        +schema: mercado
      servicios_medicos:
        +schema: servicios_medicos
      app_scouting:
        +schema: app_scouting
    # silver y gold se configurarán cuando creemos sus modelos