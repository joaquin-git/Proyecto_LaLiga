name: 'proyecto_laliga'   # proyecto de dbt Cloud: Proyecto_LaLiga (dbt exige minúsculas y _ en este nombre)
version: '1.0.0'
config-version: 2

profile: 'default'   # dbt Cloud ignora este valor y usa la conexión del proyecto

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  proyecto_laliga:
    bronze:
      +schema: bronze        # solo declara las sources; los datos los carga COPY INTO
    silver:
      +schema: silver
      +materialized: table
    gold:
      +schema: gold
      +materialized: table
