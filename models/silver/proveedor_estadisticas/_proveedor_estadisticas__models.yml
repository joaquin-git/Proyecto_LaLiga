version: 2

models:
  - name: slv_proveedor_estadisticas__actuaciones
    description: >
      Estadísticas de cada jugador en cada partido, una fila por jugador y partido.
      Modelo incremental (merge): en cada ejecución solo procesa lo cargado en bronze
      después de la última carga, y actualiza las filas cuya clave ya existe.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['partido_id', 'jugador_id']
    columns:
      - name: partido_id
        description: Partido (clave hacia slv_api_laliga__partidos). Parte de la clave compuesta.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('slv_api_laliga__partidos')
                field: partido_id
      - name: jugador_id
        description: Jugador (clave hacia slv_rrhh__jugadores). Parte de la clave compuesta.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('slv_rrhh__jugadores')
                field: jugador_id
      - name: club_id
        description: Club con el que jugó ese partido (clave hacia slv_maestros__clubes).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('slv_maestros__clubes')
                field: club_id
      - name: minutos
        description: Minutos jugados.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 120
      - name: goles
        description: Goles del jugador en el partido.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: valoracion
        description: Nota del proveedor (0-10). NULL si el proveedor no puntuó al jugador.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 10
      - name: fecha_carga
        description: Momento de la carga en bronze. Es la columna del filtro incremental.