version: 2

models:
  - name: dim_jugadores
    description: >
      Dimensión de jugadores. Una fila por jugador, con su posición y su nacionalidad principal.
      Desnormaliza lo que en silver estaba en tres tablas (jugadores, nacionalidades y países).
    config:
      contract:
        enforced: true
    columns:
      - name: jugador_id
        data_type: varchar
        description: Código de licencia del jugador (clave de la dimensión).
        constraints:
          - type: not_null
        data_tests: [unique, not_null]
      - name: nombre_jugador
        data_type: varchar
        description: Nombre del jugador. No es único (hay homónimos, como los dos Juan Cruz).
      - name: posicion
        data_type: varchar
        description: '{{ doc("posicion") }}'
      - name: fecha_nacimiento
        data_type: date
        description: Fecha de nacimiento del jugador.
      - name: nacionalidad_principal
        data_type: varchar
        description: País de la primera nacionalidad que figura en RRHH.
        data_tests: [not_null]

  - name: dim_clubes
    description: >
      Dimensión de clubes (LaLiga y extranjeros), con su liga y su país. Aplana en una tabla
      la cadena club -> liga -> país de silver (esquema en estrella).
    config:
      contract:
        enforced: true
    columns:
      - name: club_id
        data_type: varchar
        description: Clave del club.
        constraints:
          - type: not_null
        data_tests: [unique, not_null]
      - name: nombre_club
        data_type: varchar
        description: Nombre oficial del club.
      - name: ciudad
        data_type: varchar
        description: Ciudad del club. Solo informada para los clubes de LaLiga.
      - name: nombre_liga
        data_type: varchar
        description: Liga en la que juega el club.
      - name: nombre_pais
        data_type: varchar
        description: País de la liga.
      - name: es_laliga
        data_type: boolean
        description: Verdadero para los clubes de LaLiga. Sirve para filtrar en Power BI.

  - name: dim_fechas
    description: >
      Calendario: un día por fila, del 1 de julio de 2024 al 30 de junio de 2026, generado con
      dbt_utils.date_spine. Permite agrupar los hechos por mes y por temporada.
    columns:
      - name: fecha
        description: El día (clave de la dimensión).
        data_tests: [unique, not_null]
      - name: anio
        description: Año natural.
      - name: mes
        description: Mes (1 a 12).
      - name: anio_mes
        description: Año y mes en formato YYYY-MM, para agrupar por mes sin mezclar años.
      - name: temporada
        description: Temporada de fútbol (de julio a junio), en el mismo formato que silver (2024/25).
        data_tests:
          - accepted_values:
              arguments:
                values: ['2024/25', '2025/26']
  
  - name: fct_rendimiento_temporada
    description: >
      P1. Una fila por jugador, club y temporada: lo que jugó, lo que cobró ese club esa temporada
      (prorrateado por días de contrato), su coste por minuto, gol y contribución, y la comparación
      con la mediana del coste por minuto de su posición en LaLiga.
    columns:
      - name: rendimiento_id
        description: Clave de la fila (jugador + club + temporada).
        data_tests: [unique, not_null]
      - name: jugador_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_jugadores')
                field: jugador_id
      - name: club_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_clubes')
                field: club_id
      - name: salario_temporada_eur
        description: Salario cobrado en esa temporada con ese club, prorrateado por días de contrato.
        data_tests: [not_null]
      - name: coste_por_minuto_eur
        description: Solo si el jugador llega a los minutos mínimos (var minutos_minimos).
      - name: indice_coste_vs_mediana
        description: Coste por minuto dividido entre la mediana de su posición. Menor que 1 = rinde por encima de lo que cobra.

  - name: fct_lesiones
    description: >
      P2. Una fila por lesión, con lo que costó: el salario pagado al jugador durante la baja,
      según el contrato vigente ese día en ese club. El tipo de lesión y la zona van en la propia
      tabla (dimensión degenerada).
    columns:
      - name: lesion_id
        description: Identificador de la lesión.
        data_tests: [unique, not_null]
      - name: jugador_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_jugadores')
                field: jugador_id
      - name: club_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_clubes')
                field: club_id
      - name: fecha_lesion
        description: Día de la lesión (clave hacia dim_fechas, para agrupar por mes y temporada).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_fechas')
                field: fecha
      - name: dias_baja
        description: Días entre la lesión y el alta.
      - name: coste_lesion_eur
        description: Salario anual / 365 x días de baja. Lo que el club paga sin que el jugador pueda jugar.
        data_tests: [not_null]

  - name: fct_informes_scouting
    description: >
      P3. Una fila por informe de scouting, con la recomendación del ojeador extraída del texto
      libre mediante una regla de negocio (las frases con las que cierra el informe).
    columns:
      - name: informe_id
        description: Identificador del informe.
        data_tests: [unique, not_null]
      - name: jugador_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_jugadores')
                field: jugador_id
      - name: fecha_partido
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_fechas')
                field: fecha
      - name: recomendacion
        description: Fichar, Seguir observando o Descartar, según el final del texto del informe.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Fichar', 'Seguir observando', 'Descartar']

  - name: agg_shortlist_fichajes
    description: >
      P3. Jugadores con al menos un informe de "Fichar", con su encaje económico (club y salario
      actuales, último traspaso) y la posición en la que los ven los ojeadores.
    columns:
      - name: jugador_id
        description: Candidato (clave hacia dim_jugadores).
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_jugadores')
                field: jugador_id
      - name: club_actual
        description: Club del contrato vigente. Vacío si el jugador ya no tiene contrato en LaLiga.
      - name: salario_actual_eur
        description: Salario bruto anual del contrato vigente.
      - name: ultimo_traspaso_eur
        description: Importe del último traspaso pagado por el jugador. Vacío si nunca fue traspasado.