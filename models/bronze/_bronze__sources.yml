version: 2

# Una source por sistema de origen = un esquema en {ENV}_BRONZE_DB (convención del curso).
# La database depende del entorno: DEV_BRONZE_DB / PRE_BRONZE_DB / PRO_BRONZE_DB (variable DBT_ENTORNO).

sources:
  - name: api_laliga
    description: "API de LaLiga: calendario y resultados."
    database: "{{ env_var('DBT_ENTORNO', 'DEV') }}_BRONZE_DB"
    schema: api_laliga
    loaded_at_field: _FECHA_CARGA
    tables:
      - name: partidos
        identifier: PARTIDOS
        description: "Una fila = un partido. Desnormalizada: estadio, ciudad y aforo se repiten. Tiene duplicados."
        columns:
          - name: ID_PARTIDO
            data_tests: [not_null]
          - name: TEMPORADA
          - name: JORNADA
          - name: FECHA_PARTIDO
          - name: HORA
          - name: EQUIPO_LOCAL
          - name: EQUIPO_VISITANTE
          - name: ESTADIO
          - name: CIUDAD_ESTADIO
          - name: AFORO_ESTADIO
          - name: GOLES_LOCAL
          - name: GOLES_VISITANTE
          - name: RESULTADO
          - name: ESPECTADORES
          - name: ARBITRO
          - name: _FECHA_EXTRACCION
          - name: _FICHERO_ORIGEN
          - name: _FECHA_CARGA
  - name: proveedor_estadisticas
    description: "Proveedor externo de estadísticas de partido."
    database: "{{ env_var('DBT_ENTORNO', 'DEV') }}_BRONZE_DB"
    schema: proveedor_estadisticas
    loaded_at_field: _FECHA_CARGA
    tables:
      - name: estadisticas_jugador_partido
        identifier: ESTADISTICAS_JUGADOR_PARTIDO
        description: "Una fila = un jugador en un partido. Identifica al jugador con ID_JUGADOR_PROVEEDOR. Tiene duplicados."
        columns:
          - name: ID_PARTIDO
          - name: TEMPORADA
          - name: FECHA_PARTIDO
          - name: ID_JUGADOR_PROVEEDOR
          - name: JUGADOR
          - name: FECHA_NACIMIENTO
          - name: NACIONALIDAD
          - name: EQUIPO
          - name: RIVAL
          - name: CONDICION
          - name: POSICION
          - name: TITULAR
          - name: MINUTOS
          - name: GOLES
          - name: ASISTENCIAS
          - name: TIROS
          - name: TIROS_A_PUERTA
          - name: PASES_INTENTADOS
          - name: PASES_COMPLETADOS
          - name: RECUPERACIONES
          - name: TARJETAS_AMARILLAS
          - name: TARJETAS_ROJAS
          - name: VALORACION
          - name: _FECHA_EXTRACCION
          - name: _FICHERO_ORIGEN
          - name: _FECHA_CARGA
  - name: rrhh
    description: "Departamento de RRHH: registro de contratos."
    database: "{{ env_var('DBT_ENTORNO', 'DEV') }}_BRONZE_DB"
    schema: rrhh
    loaded_at_field: _FECHA_CARGA
    tables:
      - name: contratos
        identifier: CONTRATOS
        description: "Una fila = un contrato o renovación. Base del histórico salarial (SCD2)."
        columns:
          - name: ID_CONTRATO
            data_tests: [not_null]
          - name: CODIGO_LICENCIA
          - name: JUGADOR
          - name: FECHA_NACIMIENTO
          - name: NACIONALIDADES
          - name: POSICION
          - name: EQUIPO
          - name: CIUDAD_EQUIPO
          - name: TIPO_CONTRATO
          - name: CLUB_PROPIETARIO
          - name: FECHA_INICIO
          - name: FECHA_FIN_PREVISTA
          - name: FECHA_BAJA
          - name: ESTADO_CONTRATO
          - name: SALARIO_BRUTO_ANUAL_EUR
          - name: CLAUSULA_RESCISION_EUR
          - name: AGENTE
          - name: AGENCIA_REPRESENTACION
          - name: EMAIL_AGENCIA
          - name: _FECHA_EXTRACCION
          - name: _FICHERO_ORIGEN
          - name: _FECHA_CARGA
  - name: mercado
    description: "Departamento de mercado: operaciones de fichajes."
    database: "{{ env_var('DBT_ENTORNO', 'DEV') }}_BRONZE_DB"
    schema: mercado
    loaded_at_field: _FECHA_CARGA
    tables:
      - name: traspasos
        identifier: TRASPASOS
        description: "Una fila = una operación (traspaso, cesión, libre, fin de cesión). Incluye clubes de fuera de LaLiga."
        columns:
          - name: ID_OPERACION
            data_tests: [not_null]
          - name: FECHA_OPERACION
          - name: VENTANA
          - name: JUGADOR
          - name: NACIONALIDAD
          - name: POSICION
          - name: CLUB_ORIGEN
          - name: LIGA_ORIGEN
          - name: PAIS_ORIGEN
          - name: CLUB_DESTINO
          - name: LIGA_DESTINO
          - name: PAIS_DESTINO
          - name: TIPO_OPERACION
          - name: IMPORTE
          - name: _FECHA_EXTRACCION
          - name: _FICHERO_ORIGEN
          - name: _FECHA_CARGA
  - name: servicios_medicos
    description: "Servicios médicos de los clubes."
    database: "{{ env_var('DBT_ENTORNO', 'DEV') }}_BRONZE_DB"
    schema: servicios_medicos
    loaded_at_field: _FECHA_CARGA
    tables:
      - name: lesiones
        identifier: LESIONES
        description: "Una fila = una lesión. PARTE_MEDICO es texto libre (AI_FILTER en gold)."
        columns:
          - name: ID_LESION
            data_tests: [not_null]
          - name: CODIGO_LICENCIA
          - name: JUGADOR
          - name: EQUIPO
          - name: TEMPORADA
          - name: FECHA_LESION
          - name: FECHA_ALTA
          - name: TIPO_LESION
          - name: ZONA_CORPORAL
          - name: DIAS_BAJA
          - name: PARTIDOS_PERDIDOS
          - name: MEDICO_RESPONSABLE
          - name: PARTE_MEDICO
          - name: _FECHA_EXTRACCION
          - name: _FICHERO_ORIGEN
          - name: _FECHA_CARGA
  - name: app_scouting
    description: "Aplicación de scouting (texto libre de los ojeadores)."
    database: "{{ env_var('DBT_ENTORNO', 'DEV') }}_BRONZE_DB"
    schema: app_scouting
    loaded_at_field: _FECHA_CARGA
    tables:
      - name: informes_scouting
        identifier: INFORMES_SCOUTING
        description: "Una fila = un informe. INFORME es texto libre (AI_CLASSIFY / AI_COMPLETE en gold)."
        columns:
          - name: ID_INFORME
            data_tests: [not_null]
          - name: FECHA_INFORME
          - name: OJEADOR
          - name: EMAIL_OJEADOR
          - name: ZONA_OJEADOR
          - name: JUGADOR
          - name: EQUIPO_JUGADOR
          - name: PARTIDO_OBSERVADO
          - name: FECHA_PARTIDO
          - name: POSICIONES_OBSERVADAS
          - name: NOTA_GLOBAL
          - name: INFORME
          - name: _FECHA_EXTRACCION
          - name: _FICHERO_ORIGEN
          - name: _FECHA_CARGA
